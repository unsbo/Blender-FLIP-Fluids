name: Build FLIP Fluids Addon

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build FLIP Fluids (Windows MinGW64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup MSYS2 and MinGW64 Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-alembic
            mingw-w64-x86_64-imath
            mingw-w64-x86_64-openexr
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-python
            zip

      - name: Run Build Script in MSYS2 Shell
        shell: msys2 {0}
        run: |
          export CMAKE_PREFIX_PATH=/mingw64
          /mingw64/bin/python3 build.py

      - name: Bundle Required Runtime DLLs
        shell: msys2 {0}
        run: |
          mkdir -p build/bl_flip_fluids/flip_fluids_addon/ffengine/lib/
          cp /mingw64/bin/libAlembic*.dll build/bl_flip_fluids/flip_fluids_addon/ffengine/lib/ || true
          cp /mingw64/bin/libImath*.dll build/bl_flip_fluids/flip_fluids_addon/ffengine/lib/ || true
          cp /mingw64/bin/libstdc++-6.dll build/bl_flip_fluids/flip_fluids_addon/ffengine/lib/ || true
          cp /mingw64/bin/libgcc_s_seh-1.dll build/bl_flip_fluids/flip_fluids_addon/ffengine/lib/ || true
          cp /mingw64/bin/libwinpthread-1.dll build/bl_flip_fluids/flip_fluids_addon/ffengine/lib/ || true
          cp /mingw64/bin/libgomp-1.dll build/bl_flip_fluids/flip_fluids_addon/ffengine/lib/ || true
          
          # Re-package the zip file with bundled dependencies
          cd build/bl_flip_fluids/
          ZIP_NAME=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_NAME" ]; then
            rm -f "$ZIP_NAME"
            zip -r "$ZIP_NAME" flip_fluids_addon
          fi

      - name: Upload Windows Pre-built Addon
        uses: actions/upload-artifact@v4
        with:
          name: FLIP_Fluids_Addon_Windows
          path: build/bl_flip_fluids/*.zip
