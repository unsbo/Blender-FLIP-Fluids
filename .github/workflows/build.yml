name: Build FLIP Fluids Addon

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build FLIP Fluids (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Initialize Visual Studio C++ Toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run Build Script
        run: |
          python build.py

      - name: Upload Windows Pre-built Addon
        uses: actions/upload-artifact@v4
        with:
          name: FLIP_Fluids_Addon_Windows
          path: |
            build/**/*.zip
            build/*.zip
